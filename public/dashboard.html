<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Nuha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-gray-800">nuha.care</h1>
            <p class="text-xs text-gray-500" id="roleLabel">Loading...</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm text-gray-700 font-medium" id="employeeName">Loading...</span>
          <button onclick="logout()"
            class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

      <!-- Sidebar Menu -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
          <h2 class="text-sm font-semibold text-gray-500 uppercase mb-3">Menu</h2>
          <div id="menuList" class="space-y-1">
            <div class="animate-pulse space-y-2">
              <div class="h-8 bg-gray-200 rounded"></div>
              <div class="h-8 bg-gray-200 rounded"></div>
              <div class="h-8 bg-gray-200 rounded"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h2 class="text-2xl font-bold text-gray-800 mb-2">Selamat Datang!</h2>
          <p class="text-gray-600 mb-6">Anda berhasil login ke sistem manajemen karyawan nuha.care.</p>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                  </svg>
                </div>
                <div>
                  <p class="text-sm text-gray-600">Total Karyawan</p>
                  <p class="text-2xl font-bold text-gray-800">-</p>
                </div>
              </div>
            </div>
            <div class="p-4 bg-green-50 border border-green-200 rounded-lg">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-600 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                </div>
                <div>
                  <p class="text-sm text-gray-600">Total Role</p>
                  <p class="text-2xl font-bold text-gray-800">-</p>
                </div>
              </div>
            </div>
            <div class="p-4 bg-purple-50 border border-purple-200 rounded-lg">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-purple-600 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                  </svg>
                </div>
                <div>
                  <p class="text-sm text-gray-600">Total Menu</p>
                  <p class="text-2xl font-bold text-gray-800">-</p>
                </div>
              </div>
            </div>
          </div>

          <div class="border-t border-gray-200 pt-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-3">Quick Links</h3>
            <div class="grid grid-cols-2 gap-3">
              <a href="/api-docs" target="_blank"
                class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span class="text-sm font-medium text-gray-700">API Documentation</span>
              </a>
              <a href="https://github.com/keanuken" target="_blank"
                class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:border-gray-500 hover:bg-gray-50 transition">
                <svg class="w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 24 24">
                  <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/>
                </svg>
                <span class="text-sm font-medium text-gray-700">GitHub Repository</span>
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/';

    const employee = JSON.parse(localStorage.getItem('employee') || '{}');
    const role = JSON.parse(localStorage.getItem('active_role') || '{}');

    document.getElementById('employeeName').textContent = employee.name || 'User';
    document.getElementById('roleLabel').textContent = role.name || 'Role';

    async function fetchMenus() {
      try {
        const res = await fetch(`${API}/me/menus`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (!res.ok) throw new Error();
        const json = await res.json();
        renderMenus(json.data);
      } catch {
        document.getElementById('menuList').innerHTML = '<p class="text-sm text-red-600">Gagal memuat menu</p>';
      }
    }

    function renderMenus(menus, level = 0) {
      const list = document.getElementById('menuList');
      if (level === 0) list.innerHTML = '';

      menus.forEach(m => {
        const div = document.createElement('div');
        div.className = `pl-${level * 4}`;
        div.innerHTML = `
          <a href="${m.path || '#'}"
            class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
            <span>${m.name}</span>
          </a>
        `;
        list.appendChild(div);
        if (m.children && m.children.length > 0) {
          renderMenus(m.children, level + 1);
        }
      });
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/';
    }

    fetchMenus();
  </script>
</body>
</html>
