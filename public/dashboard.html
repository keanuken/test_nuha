<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Nuha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-gray-200 flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      </div>
      <div><p class="font-bold text-gray-800 text-sm">nuha.care</p><p class="text-xs text-gray-500" id="sidebarRole"></p></div>
    </div>
    <nav class="flex-1 overflow-y-auto p-3" id="sidebarMenus"></nav>
    <div class="p-4 border-t border-gray-200 flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm" id="sidebarAvatar">?</div>
      <div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 truncate" id="sidebarName"></p><p class="text-xs text-gray-500">Karyawan</p></div>
      <button onclick="logout()" class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-gray-800">Dashboard</h1>
      <a href="/api-docs" target="_blank" class="text-xs text-blue-600 hover:underline">API Docs</a>
    </header>
    <div class="flex-1 overflow-y-auto p-6">

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-5 flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </div>
          <div><p class="text-sm text-gray-500">Total Karyawan</p><p class="text-2xl font-bold text-gray-800" id="statEmployees">—</p></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5 flex items-center gap-4">
          <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          </div>
          <div><p class="text-sm text-gray-500">Total Role</p><p class="text-2xl font-bold text-gray-800" id="statRoles">—</p></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5 flex items-center gap-4">
          <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </div>
          <div><p class="text-sm text-gray-500">Total Menu</p><p class="text-2xl font-bold text-gray-800" id="statMenus">—</p></div>
        </div>
      </div>

      <!-- Welcome + Quick links -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <h2 class="font-semibold text-gray-800 mb-1">Selamat Datang 👋</h2>
          <p class="text-sm text-gray-500 mb-4">Anda login sebagai <span class="font-medium text-blue-600" id="welcomeName"></span> dengan role <span class="font-medium text-green-600" id="welcomeRole"></span>.</p>
          <div class="space-y-2 text-sm" id="quickLinks"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <h2 class="font-semibold text-gray-800 mb-3">Menu Saya</h2>
          <div id="myMenuList" class="space-y-1 text-sm text-gray-600">
            <div class="animate-pulse space-y-2"><div class="h-5 bg-gray-200 rounded"></div><div class="h-5 bg-gray-200 rounded w-3/4"></div></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
  if (!requireAuth()) throw '';
  const emp  = getEmployee();
  const role = getActiveRole();

  document.getElementById('sidebarName').textContent  = emp.name || '';
  document.getElementById('sidebarRole').textContent  = role.name || '';
  document.getElementById('sidebarAvatar').textContent = (emp.name || '?')[0].toUpperCase();
  document.getElementById('welcomeName').textContent  = emp.name || '';
  document.getElementById('welcomeRole').textContent  = role.name || '';

  renderSidebar('/dashboard');

  // Quick links — conditional by role
  (function renderQuickLinks() {
    const roleName = role.name;
    const links = [
      { href: '/master/karyawan', label: 'Manajemen Karyawan', roles: ['Super Admin', 'Manager'] },
      { href: '/master/role',     label: 'Manajemen Role',     roles: ['Super Admin'] },
      { href: '/master/menu',     label: 'Manajemen Menu',     roles: ['Super Admin', 'Manager', 'Staff'] },
    ];
    const icon = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>';
    const el = document.getElementById('quickLinks');
    el.innerHTML = links
      .filter(l => l.roles.includes(roleName))
      .map(l => `<a href="${l.href}" class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition">${icon}${l.label}</a>`)
      .join('');
  })();

  async function loadStats() {
    const [employees, roles, menus] = await Promise.all([
      api.get('/employees'),
      api.get('/roles'),
      api.get('/menus'),
    ]);
    if (employees?.ok) document.getElementById('statEmployees').textContent = employees.data.data.length;
    if (roles?.ok)     document.getElementById('statRoles').textContent     = roles.data.data.length;
    if (menus?.ok)     document.getElementById('statMenus').textContent     = menus.data.data.length;
  }

  async function loadMyMenus() {
    const res = await api.get('/me/menus');
    const el  = document.getElementById('myMenuList');
    if (!res?.ok) { el.innerHTML = '<p class="text-red-500">Gagal memuat menu</p>'; return; }
    function flatList(menus, level = 0) {
      let html = '';
      menus.forEach(m => {
        html += `<div class="flex items-center gap-2" style="padding-left:${level*12}px">
          <svg class="w-3 h-3 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          <span>${m.name}</span></div>`;
        if (m.children?.length) html += flatList(m.children, level + 1);
      });
      return html;
    }
    el.innerHTML = flatList(res.data.data) || '<p class="text-gray-400">Tidak ada menu</p>';
  }

  loadStats();
  loadMyMenus();
</script>
</body>
</html>
