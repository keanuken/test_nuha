<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Role — Nuha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-gray-200 flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      </div>
      <div><p class="font-bold text-gray-800 text-sm">nuha.care</p><p class="text-xs text-gray-500" id="sidebarRole"></p></div>
    </div>
    <nav class="flex-1 overflow-y-auto p-3" id="sidebarMenus"></nav>
    <div class="p-4 border-t border-gray-200 flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm" id="sidebarAvatar">?</div>
      <div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 truncate" id="sidebarName"></p></div>
      <button onclick="logout()" class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-gray-800">Manajemen Role</h1>
      <button onclick="openCreate()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Tambah Role
      </button>
    </header>
    <div class="flex-1 overflow-y-auto p-6">
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase">Nama Role</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase">Deskripsi</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase">Status</th>
              <th class="text-right px-5 py-3 text-xs font-semibold text-gray-500 uppercase">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="4" class="text-center py-10 text-gray-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Create/Edit -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-5" id="modalTitle">Tambah Role</h2>
    <form id="modalForm" class="space-y-4">
      <input type="hidden" id="editId" />
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Role *</label>
        <input id="fName" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
        <textarea id="fDesc" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal('modal')" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50">Batal</button>
        <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Assign Menu -->
<div id="menuModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 max-h-[80vh] flex flex-col">
    <h2 class="text-lg font-bold text-gray-800 mb-1">Assign Menu</h2>
    <p class="text-sm text-gray-500 mb-4" id="menuModalName"></p>
    <div class="flex-1 overflow-y-auto space-y-2 mb-5" id="menuCheckboxes"></div>
    <button onclick="closeModal('menuModal')" class="w-full px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50">Tutup</button>
  </div>
</div>

<script src="/app.js"></script>
<script>
  if (!requireAuth()) throw '';
  const emp = getEmployee(); const role = getActiveRole();
  document.getElementById('sidebarName').textContent = emp.name || '';
  document.getElementById('sidebarRole').textContent = role.name || '';
  document.getElementById('sidebarAvatar').textContent = (emp.name || '?')[0].toUpperCase();
  renderSidebar('/master/role');

  let allRoles = [];

  async function load() {
    const res = await api.get('/roles');
    if (res?.ok) { allRoles = res.data.data; renderTable(allRoles); }
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-gray-400">Tidak ada data</td></tr>'; return; }
    tbody.innerHTML = data.map(r => `
      <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
        <td class="px-5 py-3 font-medium text-gray-800">${r.name}</td>
        <td class="px-5 py-3 text-gray-600">${r.description || '—'}</td>
        <td class="px-5 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${r.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${r.isActive ? 'Aktif' : 'Nonaktif'}</span></td>
        <td class="px-5 py-3 text-right">
          <button onclick="openMenus('${r.id}','${r.name}')" class="text-xs text-purple-600 hover:underline mr-3">Assign Menu</button>
          <button onclick="openEdit('${r.id}')" class="text-xs text-gray-600 hover:text-blue-600 mr-3">Edit</button>
          <button onclick="deleteRole('${r.id}')" class="text-xs text-red-500 hover:text-red-700">Hapus</button>
        </td>
      </tr>`).join('');
  }

  function openCreate() {
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Tambah Role';
    document.getElementById('fName').value = '';
    document.getElementById('fDesc').value = '';
    showModal('modal');
  }

  function openEdit(id) {
    const r = allRoles.find(x => x.id === id); if (!r) return;
    document.getElementById('editId').value = id;
    document.getElementById('modalTitle').textContent = 'Edit Role';
    document.getElementById('fName').value = r.name;
    document.getElementById('fDesc').value = r.description || '';
    showModal('modal');
  }

  document.getElementById('modalForm').onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const body = { name: document.getElementById('fName').value.trim(), description: document.getElementById('fDesc').value.trim() };
    if (!body.name) return toast('Nama role wajib diisi', 'error');
    const res = id ? await api.put(`/roles/${id}`, body) : await api.post('/roles', body);
    if (res?.ok) { toast(id ? 'Role diupdate' : 'Role ditambahkan'); closeModal('modal'); load(); }
    else toast(res?.data?.message || 'Gagal menyimpan', 'error');
  };

  async function deleteRole(id) {
    if (!await confirm('Hapus role ini?')) return;
    const res = await api.delete(`/roles/${id}`);
    if (res?.ok) { toast('Role dihapus'); load(); }
    else toast(res?.data?.message || 'Gagal menghapus', 'error');
  }

  async function openMenus(roleId, roleName) {
    document.getElementById('menuModalName').textContent = roleName;
    const [roleMenus, allMenus] = await Promise.all([
      api.get(`/roles/${roleId}/menus`),
      api.get('/menus'),
    ]);
    const assigned = roleMenus?.ok ? roleMenus.data.data.map(m => m.id) : [];
    const menus = allMenus?.ok ? allMenus.data.data : [];

    function buildTree(items, parentId = null, level = 0) {
      return items.filter(m => m.parentId === parentId).map(m => `
        <label class="flex items-center gap-3 p-2.5 border rounded-lg cursor-pointer hover:bg-gray-50 transition ${assigned.includes(m.id) ? 'border-purple-300 bg-purple-50' : 'border-gray-200'}"
          style="margin-left:${level*16}px">
          <input type="checkbox" ${assigned.includes(m.id) ? 'checked' : ''} class="w-4 h-4 text-purple-600"
            onchange="toggleMenu('${roleId}','${m.id}',this.checked,this)" />
          <span class="text-sm font-medium text-gray-700">${m.name}</span>
          ${m.path ? `<span class="text-xs text-gray-400 ml-auto">${m.path}</span>` : ''}
        </label>
        ${buildTree(items, m.id, level + 1)}`).join('');
    }
    document.getElementById('menuCheckboxes').innerHTML = buildTree(menus) || '<p class="text-gray-400 text-sm">Tidak ada menu</p>';
    showModal('menuModal');
  }

  async function toggleMenu(roleId, menuId, checked, el) {
    const res = checked
      ? await api.post(`/roles/${roleId}/menus`, { menu_id: menuId })
      : await api.delete(`/roles/${roleId}/menus/${menuId}`);
    if (res?.ok) toast(checked ? 'Menu di-assign' : 'Menu di-revoke');
    else { toast(res?.data?.message || 'Gagal', 'error'); el.checked = !checked; }
  }

  load();
</script>
</body>
</html>
