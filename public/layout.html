<!-- Shared sidebar layout — include di setiap halaman -->
<div id="layout" class="flex h-screen bg-gray-50 overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <!-- Logo -->
    <div class="p-5 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
        </div>
        <div>
          <p class="font-bold text-gray-800 text-sm">nuha.care</p>
          <p class="text-xs text-gray-500" id="sidebarRole">Loading...</p>
        </div>
      </div>
    </div>

    <!-- Menu -->
    <nav class="flex-1 overflow-y-auto p-3 space-y-0.5" id="sidebarMenus">
      <!-- rendered by app.js -->
      <div class="animate-pulse space-y-2 p-2">
        <div class="h-8 bg-gray-200 rounded-lg"></div>
        <div class="h-8 bg-gray-200 rounded-lg"></div>
        <div class="h-8 bg-gray-200 rounded-lg"></div>
      </div>
    </nav>

    <!-- User -->
    <div class="p-4 border-t border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm" id="sidebarAvatar">?</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-800 truncate" id="sidebarName">Loading...</p>
          <p class="text-xs text-gray-500">Karyawan</p>
        </div>
        <button onclick="logout()" title="Logout"
          class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Topbar -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between flex-shrink-0">
      <h1 class="text-lg font-semibold text-gray-800" id="pageTitle">Dashboard</h1>
      <div class="flex items-center gap-3">
        <a href="/api-docs" target="_blank"
          class="text-xs text-blue-600 hover:underline flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          API Docs
        </a>
      </div>
    </header>

    <!-- Page content -->
    <div class="flex-1 overflow-y-auto p-6" id="pageContent">
      <!-- injected per page -->
    </div>
  </main>
</div>
