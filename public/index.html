<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuha — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">nuha.care</h1>
      <p class="text-gray-500 text-sm mt-1">Sistem Manajemen Karyawan</p>
    </div>

    <!-- Alert -->
    <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input id="username" type="text" placeholder="Masukkan username"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input id="password" type="password" placeholder="Masukkan password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition pr-10" />
          <button type="button" onclick="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" id="loginBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2">
        <span id="loginBtnText">Masuk</span>
        <svg id="loginSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
        </svg>
      </button>
    </form>

    <!-- Test accounts hint -->
    <div class="mt-6 p-3 bg-gray-50 rounded-lg text-xs text-gray-500">
      <p class="font-semibold mb-1">Test accounts:</p>
      <p>admin / admin123 → Super Admin</p>
      <p>manager1 / pass123 → Multi-role (Manager + Staff)</p>
      <p>staff1 / pass123 → Staff</p>
    </div>
  </div>

  <!-- Role Selection Modal -->
  <div id="roleModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6">
      <h2 class="text-lg font-bold text-gray-800 mb-2">Pilih Role</h2>
      <p class="text-sm text-gray-500 mb-4">Akun Anda memiliki lebih dari satu jabatan. Pilih role untuk sesi ini.</p>
      <div id="roleList" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const API = window.location.origin + '/api';
    let tempToken = null;

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.className = `mb-4 p-3 rounded-lg text-sm font-medium ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function setLoading(loading) {
      document.getElementById('loginBtn').disabled = loading;
      document.getElementById('loginBtnText').textContent = loading ? 'Memproses...' : 'Masuk';
      document.getElementById('loginSpinner').classList.toggle('hidden', !loading);
    }

    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showAlert('Username dan password wajib diisi');

      setLoading(true);
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const json = await res.json();
        if (!res.ok) return showAlert(json.message || 'Login gagal');

        const data = json.data;
        if (data.requires_role_selection) {
          // Multi-role: tampilkan modal pilih role
          tempToken = data.temp_token;
          showRoleModal(data.roles);
        } else {
          // Single role: langsung ke dashboard
          saveSession(data);
          window.location.href = '/dashboard.html';
        }
      } catch (err) {
        showAlert('Tidak dapat terhubung ke server');
      } finally {
        setLoading(false);
      }
    });

    function showRoleModal(roles) {
      const list = document.getElementById('roleList');
      list.innerHTML = roles.map(r => `
        <button onclick="selectRole('${r.id}', '${r.name}')"
          class="w-full text-left px-4 py-3 border border-gray-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition flex items-center gap-3">
          <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-sm">
            ${r.name.charAt(0)}
          </div>
          <span class="font-medium text-gray-700">${r.name}</span>
        </button>
      `).join('');
      document.getElementById('roleModal').classList.remove('hidden');
    }

    async function selectRole(roleId, roleName) {
      try {
        const res = await fetch(`${API}/auth/select-role`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tempToken}` },
          body: JSON.stringify({ role_id: roleId }),
        });
        const json = await res.json();
        if (!res.ok) return showAlert(json.message || 'Gagal memilih role');
        saveSession(json.data);
        window.location.href = '/dashboard.html';
      } catch {
        showAlert('Gagal memilih role');
      }
    }

    function saveSession(data) {
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      localStorage.setItem('active_role', JSON.stringify(data.active_role));
      localStorage.setItem('employee', JSON.stringify(data.employee));
    }

    // Redirect if already logged in
    if (localStorage.getItem('access_token')) window.location.href = '/dashboard.html';
  </script>
</body>
</html>
